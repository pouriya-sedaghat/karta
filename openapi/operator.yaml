openapi: 3.0.3
info:
  title: Karta operator API
  version: 1.0.0
  description: |
    Publication status, snapshot digest authorization, activation, rollback,
    cleanup, online update policy and metrics. Served by the publisher (`karta publisher`) on its own
    listener (`KARTA_OPERATOR_LISTEN_ADDR`, published on 127.0.0.1:8081 by
    default); the public API process has no operator routes and no write
    access to the registry. See docs/security.md for the threat model and
    docs/runbook.md for procedures.

    **Authentication.** Every `/v1/operator` request needs
    `Authorization: Bearer <token>`, a 256-bit random token (64 lowercase hex
    digits) whose SHA-256 is listed in the publisher's credentials file with
    a name and scopes: `status` (read status and audit), `publish` (authorize
    or revoke digests, activate a ready release), `rollback`, `cleanup`.
    Missing or wrong tokens get `401 unauthenticated`, a missing scope
    `403 forbidden`; both are logged and audited (at most 30 audit rows per
    minute for refusals). Tokens are never logged.

    **Requests.** `POST` bodies are `application/json`, at most 16 KiB, one
    object without unknown fields. Every action requires a `reason`
    (1–500 characters, no control characters), which is recorded in the
    audit log with the credential name, action, target and outcome. Every
    request is bounded by `KARTA_OPERATOR_REQUEST_TIMEOUT`. Responses are
    `Cache-Control: no-store` and carry `X-Request-ID`.

    **Concurrency.** The active pointer changes only in one registry
    transaction under a lock, compared against an expected active release:
    the one given as `expected_active_release_id` (`"none"` for no active
    release), or else the one active when the request arrived. Of two
    concurrent switches, the second gets `409 active_release_changed` (or
    succeeds as a no-op when its target is already active). A switch waits at
    most a few seconds for the pointer lock (`409 busy`). Imports do not hold
    the pointer lock, so a rollback is never blocked by a running import; an
    import that finishes after a rollback stays `ready` instead of activating.

    **Online updates (Stage 3, opt-in).** With `KARTA_ONLINE_SOURCE_FILE`
    set, the publisher also processes the online fetcher's deliveries: each
    must carry a manifest signed by a key pinned in the source file (see
    docs/adr/0004-stage3-online-updates.md). `status.online` reports the
    source, the activation policy, the newest manifest the publisher
    verified and the fetcher's own report (checks, errors, next attempt,
    download progress); `status.freshness` the active data's age against
    `KARTA_DATA_STALE_AFTER`. A rollback pauses automatic activation of
    online snapshots (`online/resume` lifts it); paused deliveries are built
    and kept `ready` with reason code `online_activation_paused`. The
    signed manifest is verified again at the switch: if it expired or its
    key was removed during the build, the submission is `rejected` with the
    verification code (reason "at activation ...") and its validated
    release stays `ready`.

    **Local intake (Stage 5, opt-in).** With `KARTA_INTAKE_DIR` set, the
    publisher also processes the local intake's handoff directory (scanned
    first, then the inbox, then online deliveries). Intake credentials hold
    exactly one scope, `intake_watch` (the unattended watcher) or
    `intake_submit` (a named person's command), and reach only
    `/v1/operator/intake/authorizations`: they create bounded authorizations
    for one exact digest (required size, the publisher's region, at most
    `KARTA_INTAKE_AUTHORIZATION_MAX_AGE`, at most `KARTA_INTAKE_MAX_OPEN` open
    per credential), read their own, and close their own. Every other route
    answers them `403`. Every automatic manual, command-line and intake
    activation re-checks, at the switch, that the digest is still pinned or
    covered by an open, unexpired authorization; otherwise the submission is
    `rejected` (`authorization_revoked`, `authorization_expired` or
    `unauthorized_digest`, reason "at activation ...") and its release stays
    `ready`; a fresh authorization re-evaluates it and activates the ready
    release without a rebuild. A rollback also pauses automatic activation of
    deliveries admitted only by `intake_watch` authorizations
    (`intake_activation_paused`; `intake/resume` lifts it). See
    docs/adr/0006-stage5-hybrid-intake.md.

    **Credentials** are read again when the publisher's credentials file
    changes; while it cannot be read or does not parse, every request is
    refused with `503 credentials_unavailable`.
  license:
    name: Apache-2.0 (API description)
servers:
  - url: http://127.0.0.1:8081
security:
  - bearer: []
paths:
  /health/live:
    get:
      summary: Publisher process liveness (no authentication, no information)
      operationId: operatorLive
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /v1/operator/status:
    get:
      summary: Publication status
      operationId: operatorStatus
      description: Scope `status`. Region and policy, active and recent releases, recent submissions, open digest authorizations, the inbox, online updates, data freshness, the job in progress and storage use.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/audit:
    get:
      summary: Audit log, newest first
      operationId: operatorAudit
      description: Scope `status`. Append-only records of every publication step and operator action.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before_id, in: query, description: Only records with a smaller id (paging).,
            schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: Audit records.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/openapi.yaml:
    get:
      summary: This document
      operationId: operatorOpenAPI
      description: Scope `status`.
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/operator/authorizations:
    post:
      summary: Authorize one exact snapshot digest for the configured region
      operationId: operatorAuthorize
      description: |
        Scope `publish`. Records that the operator has verified this exact
        snapshot (by SHA-256, and size if given) out of band. Only a digest
        that is pinned in the region configuration or authorized here is
        imported; there is no way to accept arbitrary files. An open,
        unexpired authorization for the same digest and size is returned
        unchanged (`200`, `created: false`). A submission rejected earlier as
        `unauthorized_digest` is re-evaluated on the next inbox scan once its
        digest is authorized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, reason]
              properties:
                sha256: { $ref: "#/components/schemas/SHA256" }
                size_bytes: { type: integer, format: int64, minimum: 1, description: "If given, only a file of exactly this size matches." }
                expires_at: { type: string, format: date-time, description: "Optional end of the authorization, in the future and at most one year ahead." }
                reason: { $ref: "#/components/schemas/Reason" }
      responses:
        "201":
          description: Authorization created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationResult" }
        "200":
          description: An equal authorization already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/authorizations/{sha256}/revoke:
    post:
      summary: Revoke the open authorization of a digest
      operationId: operatorRevoke
      description: Scope `publish`. Releases already built from the digest are not affected.
      parameters:
        - { name: sha256, in: path, required: true, schema: { $ref: "#/components/schemas/SHA256" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: Whether an open authorization was revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/releases/{release_id}/activate:
    post:
      summary: Activate a ready or retired release (forward only)
      operationId: operatorActivate
      description: |
        Scope `publish`. The target must be retained and validated (`ready`
        or `retired`), pass the same compatibility checks as serving (schema
        major, style, serving toolchain), and satisfy the forward rule: a
        newer data timestamp than the active release, or the same snapshot
        rebuilt. Going back is a rollback. With the region's
        `validation.max_drop_fraction`, the target must also keep enough of
        every table's rows of the release active at the moment of the switch
        (checked in the pointer transaction), whatever it was validated
        against: otherwise `409 policy_refused` with reason code
        `excessive_data_loss`, or `counts_unavailable` if either release's
        row counts cannot be read. The previous release stays servable to
        pinned clients for the pin grace period.
      parameters:
        - { name: release_id, in: path, required: true, schema: { $ref: "#/components/schemas/ReleaseID" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchBody" }
      responses:
        "200":
          description: Switched, or already active (`changed` false).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/rollback:
    post:
      summary: Roll back to a retained, validated, compatible release
      operationId: operatorRollback
      description: |
        Scope `rollback`. Without `release_id`, the target is the most
        recently replaced retained (`retired`) release. The target must be
        `ready` or `retired` (never `removing`, `removed` or `failed`) and
        pass the serving compatibility checks. Only the active pointer
        changes; release contents are immutable. A region change must be
        explicit (`allow_region_change`). Rollback is the explicit way back
        and has no row-count gate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchBody" }
      responses:
        "200":
          description: Rolled back, or the target is already active (`changed` false).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/cleanup:
    post:
      summary: Remove releases beyond the retention policy
      operationId: operatorCleanup
      description: |
        Scope `cleanup`. Keeps the active release, the
        `KARTA_RETAIN_RELEASES` most recent other validated releases, and
        every release still inside its pin grace (plus the drain margin).
        A release whose database has any session is skipped. `dry_run` only
        reports the decisions. Cleanup also runs after each publication and
        every `KARTA_CLEANUP_INTERVAL`. The request is audited (action
        `cleanup`) with its actual result: `succeeded`, `noop` (dry run, with
        `would_remove`, or nothing removed) or `failed` (answered `503`; the
        record has the `error` and what was `removed` before it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Decisions and what was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/metrics:
    get:
      summary: Publication, freshness and online-source metrics (Prometheus text format)
      operationId: operatorMetrics
      description: |
        Scope `status` (scrape with the monitoring token as a bearer token).
        Gauges computed at scrape time from the registry and the fetcher's
        state, for example `karta_active_data_age_seconds`, `karta_data_stale`
        (only with a staleness threshold), `karta_online_last_success_timestamp_seconds`,
        `karta_online_next_attempt_timestamp_seconds`,
        `karta_online_consecutive_failures`, `karta_online_fetcher_state_age_seconds`,
        `karta_online_verified_serial`, `karta_submissions{source,state}`,
        `karta_submission_last_finished_timestamp_seconds{source,state}`,
        `karta_staging_free_bytes`, `karta_db_volume_free_bytes`; the
        publication deadline and the running publication
        (`karta_publication_timeout_seconds`, `karta_publication_running_seconds`);
        and, since this process started, publication outcomes
        (`karta_publications_total{source,state}`), timeouts
        (`karta_publication_timeouts_total`) and a duration histogram
        (`karta_publication_duration_seconds{source}`), plus
        `karta_publisher_start_time_seconds`. Labels are bounded (source,
        state, release id, error code); the alert rules and their responses are
        in deploy/monitoring and docs/operations.md. The API process exports
        its own request metrics on a separate listener, not here.
      responses:
        "200":
          description: Metrics.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/intake/authorizations:
    post:
      summary: Authorize one exact digest for the local intake (intake credentials only)
      operationId: operatorIntakeAuthorize
      description: |
        Scope `intake_watch` or `intake_submit`, and nothing else. Creates an
        authorization for one exact snapshot digest and size, for the handoff
        name the intake will use, valid for `ttl_seconds` (at most the
        publisher's cap). The channel is the credential's scope. The same
        credential repeating the same digest, size and name gets its open
        authorization back (`200`, `created: false`); a different size or name
        closes only that credential's own row first. Authorizations of
        operators and of other intake credentials are never touched.
        `409 intake_disabled` without `KARTA_INTAKE_DIR`; `409
        intake_limit_reached` beyond `KARTA_INTAKE_MAX_OPEN`; `409
        intake_refused` (`reason_code` `region_mismatch`, `too_large`,
        `validity_beyond_cap`) outside the publisher's bounds. Audited as
        `intake_authorize`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, size_bytes, region_id, ttl_seconds, name, reason]
              properties:
                sha256: { $ref: "#/components/schemas/SHA256" }
                size_bytes: { type: integer, format: int64, minimum: 1 }
                region_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: Must be the publisher's region. }
                ttl_seconds: { type: integer, format: int64, minimum: 60, description: "Validity from now; at most `limits.max_ttl_seconds`." }
                name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$", description: The handoff name. }
                reason: { $ref: "#/components/schemas/Reason" }
      responses:
        "201":
          description: Authorization created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationResult" }
        "200":
          description: The credential's equal open authorization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      summary: The caller's own intake authorizations and their outcomes
      operationId: operatorIntakeList
      description: |
        Scope `intake_watch` or `intake_submit`. The caller's open
        authorizations and those closed in the last week, each with the
        newest intake submission carrying its handoff name, and the limits the
        publisher enforces. Nothing else is visible.
      responses:
        "200":
          description: The caller's records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/intake/authorizations/{id}/close:
    post:
      summary: Close one of the caller's own intake authorizations
      operationId: operatorIntakeClose
      description: |
        Scope `intake_watch` or `intake_submit`. Another principal's id is
        `404 not_found`. Closing a closed authorization is a no-op
        (`closed: false`). Audited as `intake_close`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: Whether the authorization was open.
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/intake/pause:
    post:
      summary: Pause automatic activation of watcher deliveries
      operationId: operatorIntakePause
      description: |
        Scope `publish`. Deliveries admitted only by `intake_watch`
        authorizations are still built and validated, but kept `ready`
        (`intake_activation_paused`). A rollback pauses automatically.
        Deliveries by the authenticated command (`intake_submit`), operator
        authorizations and pins are not paused. Audited as `intake_pause`.
        `409 intake_disabled` without the intake.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: The policy after the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakePolicyResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/intake/resume:
    post:
      summary: Resume automatic activation of watcher deliveries
      operationId: operatorIntakeResume
      description: |
        Scope `publish`. Applies to the next activation; a release kept
        `ready` while paused is activated explicitly. Audited as
        `intake_resume`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: The policy after the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakePolicyResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/online/pause:
    post:
      summary: Pause automatic activation of online snapshots
      operationId: operatorOnlinePause
      description: |
        Scope `publish`. Online deliveries are still downloaded, verified,
        built and validated, but kept `ready` (reason code
        `online_activation_paused`) for an explicit activation. The pause is
        recorded in the registry (it survives restarts) and audited
        (`online_pause`; a request that changes nothing is audited as
        `noop`). A rollback pauses automatically. `409 online_disabled` when
        online updates are not enabled (audited as rejected).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: The policy after the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlinePolicyResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/online/resume:
    post:
      summary: Resume automatic activation of online snapshots
      operationId: operatorOnlineResume
      description: |
        Scope `publish`. Applies to the next delivery; a release kept `ready`
        while paused is activated explicitly (`releases/{id}/activate`).
        Audited as `online_resume`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: The policy after the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlinePolicyResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/operator/online/retry:
    post:
      summary: Queue the newest failed online delivery for another attempt
      operationId: operatorOnlineRetry
      description: |
        Scope `publish`. The newest online submission must have ended
        `failed`, `rejected` or `interrupted` and its files must still be in
        the fetcher's outbox (for example after freeing disk space). The next
        scan processes it again. `409 nothing_to_retry` otherwise. Audited as
        `online_retry`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: The delivery queued.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued:
                    type: object
                    required: [submission_id, name, previous_state, previous_reason_code]
                    properties:
                      submission_id: { type: integer, format: int64 }
                      name: { type: string }
                      previous_state: { type: string }
                      previous_reason_code: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ReleaseID: { type: string, pattern: "^r[0-9a-f]{24}$" }
    SHA256: { type: string, pattern: "^[0-9a-f]{64}$" }
    Reason: { type: string, minLength: 1, maxLength: 500, description: Why; recorded in the audit log. }
    ReasonBody:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
    Timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthenticated, forbidden, invalid_request, request_body_too_large, unsupported_media_type, method_not_allowed,
                     not_found, unknown_release, release_not_eligible, release_incompatible, active_release_changed, busy,
                     no_rollback_target, policy_refused, timeout, service_unavailable, internal_error, online_disabled,
                     nothing_to_retry, intake_disabled, intake_limit_reached, intake_refused, credentials_unavailable]
            message: { type: string }
            reason_code:
              type: string
              description: |
                For `policy_refused`, the rule that refused (older_than_active, not_newer, region_changed, excessive_data_loss,
                counts_unavailable, region_config); for `intake_refused`, region_mismatch, too_large or validity_beyond_cap.
            request_id: { type: string }
    SwitchBody:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        release_id: { $ref: "#/components/schemas/ReleaseID" }
        expected_active_release_id:
          type: string
          pattern: "^(r[0-9a-f]{24}|none)$"
          description: Compare-and-swap guard; defaults to the release active when the request arrived.
        allow_region_change: { type: boolean, default: false }
        reason: { $ref: "#/components/schemas/Reason" }
    SwitchResult:
      type: object
      required: [result]
      properties:
        result:
          type: object
          required: [previous_release_id, active_release_id, changed, previous_pinned_until]
          properties:
            previous_release_id: { type: string, description: Empty when nothing was active. }
            active_release_id: { type: string }
            changed: { type: boolean }
            previous_pinned_until: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true,
                                     description: Until when clients that pinned the previous release are served. }
    Release:
      type: object
      required: [release_id, database, state, region_id, source_sha256, source_size_bytes, schema_revision, style_revision,
                 schema_major, data_timestamp, failure_reason, database_bytes, submission_id, activated_at, deactivated_at,
                 pinned_until, removed_at, created_at, updated_at]
      properties:
        release_id: { $ref: "#/components/schemas/ReleaseID" }
        database: { type: string }
        state: { type: string, enum: [importing, validating, ready, active, retired, failed, removing, removed] }
        region_id: { type: string }
        source_sha256: { $ref: "#/components/schemas/SHA256" }
        source_size_bytes: { type: integer, format: int64, nullable: true }
        schema_revision: { type: string }
        style_revision: { type: string }
        schema_major: { type: integer, nullable: true }
        data_timestamp: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        failure_reason: { type: string, nullable: true }
        database_bytes: { type: integer, format: int64, nullable: true }
        counts: { type: object, additionalProperties: { type: integer, format: int64 } }
        submission_id: { type: integer, format: int64, nullable: true }
        activated_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        deactivated_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        pinned_until: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        removed_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ReleaseStatus:
      allOf:
        - $ref: "#/components/schemas/Release"
        - type: object
          required: [rollback_eligible, pinned_served]
          properties:
            rollback_eligible: { type: boolean, description: "Retained, validated and not active." }
            pinned_served: { type: boolean, description: Retired and still inside its pin grace. }
    Submission:
      type: object
      required: [id, source, name, fingerprint, region_id, marker_sha256, sha256, size_bytes, data_timestamp, state, reason_code,
                 reason, release_id, attempts, created_at, updated_at, finished_at, manifest_serial, manifest_sha256]
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, enum: [inbox, cli, online, intake] }
        name: { type: string }
        fingerprint: { type: string }
        region_id: { type: string }
        marker_sha256: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        size_bytes: { type: integer, format: int64, nullable: true }
        data_timestamp: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        state: { type: string, enum: [processing, published, ready, duplicate, rejected, failed, interrupted] }
        reason_code:
          type: string
          nullable: true
          description: |
            Why the submission ended as it did, for example `unauthorized_digest`,
            `authorization_expired`, `authorization_revoked`, `intake_activation_paused`,
            `insufficient_storage`, `policy_refused` or `publication_timeout` (the
            whole publication exceeded `KARTA_PUBLISH_TIMEOUT` and was stopped; it
            is final and not retried automatically: submit it again after raising
            the deadline or fixing the cause). See docs/runbook.md for the list.
        reason: { type: string, nullable: true }
        release_id: { type: string, nullable: true }
        attempts: { type: integer }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        manifest_serial: { type: integer, format: int64, nullable: true, description: Serial of the signed manifest of an online delivery. }
        manifest_sha256: { type: string, nullable: true, description: SHA-256 of the signed manifest envelope of an online delivery. }
    Authorization:
      type: object
      required: [id, region_id, sha256, size_bytes, reason, created_by, created_at, expires_at, revoked_at, revoked_by, revoke_reason,
                 channel, intake_name]
      properties:
        id: { type: integer, format: int64 }
        region_id: { type: string }
        sha256: { $ref: "#/components/schemas/SHA256" }
        size_bytes: { type: integer, format: int64, nullable: true }
        reason: { type: string }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        revoked_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        revoked_by: { type: string, nullable: true }
        revoke_reason: { type: string, nullable: true }
        channel: { type: string, enum: [operator, intake_watch, intake_submit], description: Who created it. }
        intake_name: { type: string, nullable: true, description: The handoff name of an intake authorization. }
    AuthorizationResult:
      type: object
      required: [authorization, created]
      properties:
        authorization: { $ref: "#/components/schemas/Authorization" }
        created: { type: boolean }
    AuditEntry:
      type: object
      required: [id, at, actor, source, action, outcome]
      properties:
        id: { type: integer, format: int64 }
        at: { $ref: "#/components/schemas/Timestamp" }
        actor: { type: string, description: "Credential name, `inbox`, `cli`, `system` or `anonymous`." }
        source: { type: string, enum: [operator_api, inbox, cli, system, online, intake] }
        action: { type: string }
        target: { type: string }
        outcome: { type: string, enum: [succeeded, rejected, failed, denied, noop] }
        reason: { type: string }
        request_id: { type: string }
        detail: {}
    CleanupResult:
      type: object
      required: [dry_run, decisions, removed, skipped]
      properties:
        dry_run: { type: boolean }
        decisions:
          type: array
          items:
            type: object
            required: [release_id, state, action, why]
            properties:
              release_id: { type: string }
              state: { type: string }
              action: { type: string, enum: [keep, remove] }
              why: { type: string }
        removed: { type: array, items: { type: string } }
        skipped:
          type: array
          items:
            type: object
            required: [release_id, why]
            properties:
              release_id: { type: string }
              why: { type: string }
    Status:
      type: object
      required: [region, policy, active, releases, submissions, authorizations, inbox, job, storage, online, intake, freshness]
      properties:
        region:
          type: object
          required: [id, name, pinned_digests, require_provenance]
          properties:
            id: { type: string }
            name: { type: string }
            pinned_digests: { type: array, items: { $ref: "#/components/schemas/SHA256" } }
            require_provenance: { type: boolean }
            error: { type: string }
        policy:
          type: object
          required: [auto_activate, pin_grace_seconds, retain_releases, max_attempts, inbox_settle_seconds]
          properties:
            auto_activate: { type: boolean }
            pin_grace_seconds: { type: number }
            retain_releases: { type: integer }
            max_attempts: { type: integer }
            inbox_settle_seconds: { type: number }
        active: { allOf: [{ $ref: "#/components/schemas/Release" }], nullable: true }
        releases: { type: array, items: { $ref: "#/components/schemas/ReleaseStatus" } }
        submissions: { type: array, items: { $ref: "#/components/schemas/Submission" } }
        authorizations: { type: array, items: { $ref: "#/components/schemas/Authorization" } }
        inbox:
          type: object
          required: [enabled, last_scan]
          properties:
            enabled: { type: boolean }
            last_scan:
              type: object
              required: [at, pending]
              properties:
                at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
                error: { type: string }
                pending:
                  type: array
                  items:
                    type: object
                    required: [name, waiting]
                    properties:
                      name: { type: string }
                      waiting: { type: string, enum: [waiting_for_ready_marker, waiting_for_snapshot, settling] }
                      problem: { type: string }
        job:
          type: object
          nullable: true
          required: [submission_id, name, source, phase, started_at, phase_started_at]
          properties:
            submission_id: { type: integer, format: int64 }
            name: { type: string }
            source: { type: string }
            phase: { type: string }
            started_at: { $ref: "#/components/schemas/Timestamp" }
            phase_started_at: { $ref: "#/components/schemas/Timestamp" }
            release_id: { type: string }
        storage:
          type: object
          required: [release_bytes, candidate_estimate_bytes, budget_bytes, db_volume_free_bytes, staging_free_bytes, min_free_bytes]
          properties:
            release_bytes: { type: integer, format: int64 }
            candidate_estimate_bytes: { type: integer, format: int64 }
            budget_bytes: { type: integer, format: int64 }
            db_volume_free_bytes: { type: integer, format: int64, nullable: true }
            staging_free_bytes: { type: integer, format: int64, nullable: true }
            min_free_bytes: { type: integer, format: int64 }
        online: { $ref: "#/components/schemas/OnlineStatus" }
        intake: { $ref: "#/components/schemas/IntakeStatus" }
        freshness:
          type: object
          required: [update_mode, active_data_timestamp, active_data_age_seconds, stale_after_seconds, stale]
          description: Age of the active release's data (never derived from a source check) against KARTA_DATA_STALE_AFTER.
          properties:
            update_mode: { type: string, enum: [manual, online] }
            active_data_timestamp: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
            active_data_age_seconds: { type: number, nullable: true }
            stale_after_seconds: { type: number, nullable: true, description: Null when no threshold is configured. }
            stale: { type: boolean, nullable: true, description: Null when no threshold is configured or nothing is active. }
        failpoints: { type: array, items: { type: string }, description: Only present in test runs with fault injection. }
    OnlinePolicy:
      type: object
      required: [region_id, auto_activate, changed_at, changed_by, change_reason, retry_requested_at]
      properties:
        region_id: { type: string }
        auto_activate: { type: boolean, description: False while automatic activation of online snapshots is paused. }
        changed_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        changed_by: { type: string, nullable: true }
        change_reason: { type: string, nullable: true }
        retry_requested_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
    OnlinePolicyResult:
      type: object
      required: [changed, policy]
      properties:
        changed: { type: boolean }
        policy: { $ref: "#/components/schemas/OnlinePolicy" }
    Problem:
      type: object
      nullable: true
      required: [at, code, message]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        code: { type: string }
        message: { type: string }
    OnlineStatus:
      type: object
      required: [enabled, source, auto_activate, policy, verified, fetcher, last_scan]
      properties:
        enabled: { type: boolean }
        source:
          type: object
          nullable: true
          required: [region_id, manifest, trusted_keys, require_operator_authorization, poll_interval_seconds, max_manifest_validity_seconds]
          properties:
            region_id: { type: string }
            manifest: { type: string, description: "Manifest URL (https, no credentials or query)." }
            trusted_keys:
              type: array
              items:
                type: object
                required: [id, fingerprint, not_after]
                properties:
                  id: { type: string }
                  fingerprint: { type: string, description: "sha256: of the raw Ed25519 public key." }
                  not_after: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
            require_operator_authorization: { type: boolean }
            poll_interval_seconds: { type: number }
            max_manifest_validity_seconds: { type: number }
            error: { type: string, description: The source file could not be read. }
        auto_activate: { type: boolean, description: "Whether a validated online snapshot is activated now: KARTA_PUBLISH_AUTO_ACTIVATE and not paused." }
        policy: { allOf: [{ $ref: "#/components/schemas/OnlinePolicy" }], nullable: true }
        verified:
          type: object
          nullable: true
          description: The newest signed manifest the publisher verified on a delivery.
          required: [region_id, serial, envelope_sha256, snapshot_sha256, snapshot_size_bytes, data_timestamp, issued_at, expires_at,
                     key_id, submission_id, verified_at]
          properties:
            region_id: { type: string }
            serial: { type: integer, format: int64 }
            envelope_sha256: { $ref: "#/components/schemas/SHA256" }
            snapshot_sha256: { $ref: "#/components/schemas/SHA256" }
            snapshot_size_bytes: { type: integer, format: int64 }
            data_timestamp: { $ref: "#/components/schemas/Timestamp" }
            issued_at: { $ref: "#/components/schemas/Timestamp" }
            expires_at: { $ref: "#/components/schemas/Timestamp" }
            key_id: { type: string }
            submission_id: { type: integer, format: int64, nullable: true }
            verified_at: { $ref: "#/components/schemas/Timestamp" }
        fetcher:
          type: object
          required: [state, state_age_seconds]
          description: The fetcher's own report, read from its state file (the network-facing process; shown as reported).
          properties:
            state: { allOf: [{ $ref: "#/components/schemas/FetcherState" }], nullable: true }
            state_age_seconds: { type: number, nullable: true, description: Seconds since the fetcher last wrote its state. }
            error: { type: string }
        last_scan:
          type: object
          required: [at, pending]
          properties:
            at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
            error: { type: string }
            pending:
              type: array
              items:
                type: object
                required: [name, waiting]
                properties:
                  name: { type: string }
                  waiting: { type: string, enum: [waiting_for_ready_marker, waiting_for_snapshot, settling] }
                  problem: { type: string }
    FetcherState:
      type: object
      required: [version, updated_at, source, last_check_at, last_success_at, last_error, consecutive_failures, next_attempt_at,
                 highest_serial, current, delivered, download]
      properties:
        version: { type: integer }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        source: { type: string }
        last_check_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        last_success_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          nullable: true
          description: Last check that completed (manifest fetched and verified; the snapshot it names delivered or already delivered).
        last_error: { $ref: "#/components/schemas/Problem" }
        consecutive_failures: { type: integer }
        next_attempt_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        highest_serial: { type: integer, format: int64 }
        current:
          type: object
          nullable: true
          required: [serial, envelope_sha256, snapshot_sha256, size_bytes, data_timestamp, issued_at, expires_at, key_id, verified_at]
          properties:
            serial: { type: integer, format: int64 }
            envelope_sha256: { type: string }
            snapshot_sha256: { type: string }
            size_bytes: { type: integer, format: int64 }
            data_timestamp: { $ref: "#/components/schemas/Timestamp" }
            issued_at: { $ref: "#/components/schemas/Timestamp" }
            expires_at: { $ref: "#/components/schemas/Timestamp" }
            key_id: { type: string }
            verified_at: { $ref: "#/components/schemas/Timestamp" }
        delivered:
          type: object
          nullable: true
          required: [name, serial, snapshot_sha256, size_bytes, data_timestamp, delivered_at]
          properties:
            name: { type: string }
            serial: { type: integer, format: int64 }
            snapshot_sha256: { type: string }
            size_bytes: { type: integer, format: int64 }
            data_timestamp: { $ref: "#/components/schemas/Timestamp" }
            delivered_at: { $ref: "#/components/schemas/Timestamp" }
        download:
          type: object
          nullable: true
          required: [snapshot_sha256, size_bytes, bytes, started_at, attempts, abandoned_until]
          properties:
            snapshot_sha256: { type: string }
            size_bytes: { type: integer, format: int64 }
            bytes: { type: integer, format: int64 }
            started_at: { $ref: "#/components/schemas/Timestamp" }
            attempts: { type: integer }
            abandoned_until: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
    IntakePolicy:
      type: object
      required: [region_id, watcher_auto_activate, changed_at, changed_by, change_reason]
      properties:
        region_id: { type: string }
        watcher_auto_activate: { type: boolean, description: False while automatic activation of watcher deliveries is paused. }
        changed_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        changed_by: { type: string, nullable: true }
        change_reason: { type: string, nullable: true }
    IntakePolicyResult:
      type: object
      required: [changed, policy]
      properties:
        changed: { type: boolean }
        policy: { $ref: "#/components/schemas/IntakePolicy" }
    IntakeLimits:
      type: object
      required: [region_id, max_ttl_seconds, max_open, max_snapshot_bytes]
      properties:
        region_id: { type: string }
        max_ttl_seconds: { type: number }
        max_open: { type: integer }
        max_snapshot_bytes: { type: integer, format: int64 }
    IntakeList:
      type: object
      required: [limits, records]
      properties:
        limits: { $ref: "#/components/schemas/IntakeLimits" }
        records:
          type: array
          items:
            type: object
            required: [authorization, submission]
            properties:
              authorization: { $ref: "#/components/schemas/Authorization" }
              submission: { allOf: [{ $ref: "#/components/schemas/Submission" }], nullable: true }
    IntakeStatus:
      type: object
      required: [enabled, auto_activate, policy, limits, open_authorizations, watcher, last_scan]
      properties:
        enabled: { type: boolean }
        auto_activate: { type: boolean, description: "Whether a watcher delivery is activated now: KARTA_PUBLISH_AUTO_ACTIVATE and not paused." }
        policy: { allOf: [{ $ref: "#/components/schemas/IntakePolicy" }], nullable: true }
        limits: { allOf: [{ $ref: "#/components/schemas/IntakeLimits" }], nullable: true }
        open_authorizations: { type: object, additionalProperties: { type: integer, format: int64 }, description: "Open, unexpired intake authorizations by channel." }
        watcher:
          type: object
          required: [state, state_age_seconds]
          description: The watcher's own report, read from its state file in the handoff directory.
          properties:
            state: { allOf: [{ $ref: "#/components/schemas/IntakeState" }], nullable: true }
            state_age_seconds: { type: number, nullable: true }
            error: { type: string }
        last_scan:
          type: object
          required: [at, pending]
          properties:
            at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
            error: { type: string }
            pending:
              type: array
              items:
                type: object
                required: [name, waiting]
                properties:
                  name: { type: string }
                  waiting: { type: string, enum: [waiting_for_ready_marker, waiting_for_snapshot, settling] }
                  problem: { type: string }
    IntakeHandoff:
      type: object
      required: [name, from, sha256, size_bytes, authorization_id, channel, handed_off_at, submission_state]
      properties:
        name: { type: string }
        from: { type: string, description: The landing file it came from. }
        sha256: { type: string }
        size_bytes: { type: integer, format: int64 }
        authorization_id: { type: integer, format: int64 }
        channel: { type: string }
        handed_off_at: { $ref: "#/components/schemas/Timestamp" }
        landing_fingerprint: { type: string }
        submission_state: { type: string }
        reason_code: { type: string }
        release_id: { type: string }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
    IntakeState:
      type: object
      required: [version, updated_at, landing, last_scan_at, stopped_at, preflight, entries, handoffs, last_outcome, last_error, consumed]
      properties:
        version: { type: integer }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        landing: { type: string }
        last_scan_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }], nullable: true }
        stopped_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          nullable: true
          description: Set when the watcher stopped cleanly (a deliberate stop or shutdown); cleared by its next scan.
        preflight:
          type: object
          required: [ok, checked_at, fs_type, problems]
          properties:
            ok: { type: boolean }
            checked_at: { $ref: "#/components/schemas/Timestamp" }
            fs_type: { type: string }
            problems:
              type: array
              nullable: true
              items:
                type: object
                required: [code, path, detail]
                properties:
                  code: { type: string }
                  path: { type: string }
                  detail: { type: string }
        entries:
          type: array
          nullable: true
          items:
            type: object
            required: [name, state, size_bytes]
            properties:
              name: { type: string }
