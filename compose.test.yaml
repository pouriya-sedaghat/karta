# Integration-test overrides (project `karta-test`, see `make test-integration`).
# Publishes PostgreSQL on 127.0.0.1 so tests can inspect and tamper with a
# release as the superuser; never use this file for a real deployment.
services:
  db:
    ports:
      - "127.0.0.1:${KARTA_TEST_DB_PORT:-55433}:5432"
    networks: [backend, frontend]
    # A small filesystem for the disk-exhaustion test: the test creates a
    # tablespace here, fills it, and points new release databases at it.
    tmpfs:
      - /var/lib/postgresql/tight:size=${KARTA_TEST_TIGHT_SIZE:-96m},uid=999,gid=999,mode=0700
  api:
    ports: !override
      - "127.0.0.1:${KARTA_TEST_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${KARTA_TEST_METRICS_PORT:-18083}:9464"
    environment:
      # The integration test recreates the API with another base URL to check
      # that previously issued style URLs are not reused for different bytes.
      KARTA_PUBLIC_BASE_URL: ${KARTA_TEST_PUBLIC_BASE_URL:-http://127.0.0.1:${KARTA_TEST_HTTP_PORT:-18080}}
      KARTA_RELEASE_POLL_INTERVAL: 1s
      KARTA_CORS_ALLOWED_ORIGINS: https://app.example
  publisher:
    ports: !override
      - "127.0.0.1:${KARTA_TEST_OPERATOR_PORT:-18081}:8081"
    environment:
      # The validation-policy test points the publisher at a region file it
      # edits (in KARTA_TEST_REGION_DIR, mounted below).
      KARTA_REGION_FILE: ${KARTA_TEST_REGION_FILE:-/config/regions/fixture.json}
      KARTA_INBOX_POLL_INTERVAL: 1s
      KARTA_INBOX_SETTLE: 1s
      KARTA_PUBLISH_AUTO_ACTIVATE: ${KARTA_TEST_AUTO_ACTIVATE:-true}
      KARTA_RELEASE_PIN_GRACE: ${KARTA_TEST_PIN_GRACE:-20s}
      KARTA_RETAIN_RELEASES: ${KARTA_TEST_RETAIN:-10}
      KARTA_CLEANUP_MARGIN: 30s
      KARTA_RELEASE_STORAGE_BUDGET_MB: ${KARTA_TEST_BUDGET_MB:-10240}
      KARTA_STAGING_RESERVE_MB: "1"
      KARTA_MIN_FREE_MB: "0"
      KARTA_RELEASE_TABLESPACE: ${KARTA_TEST_TABLESPACE:-}
      # slow-osm2pgsql delays every import by 15 s, for the tests that must
      # observe or interrupt a running import.
      KARTA_OSM2PGSQL: ${KARTA_TEST_OSM2PGSQL:-osm2pgsql}
      # The bounded-publication tests shorten the whole-publication deadline.
      KARTA_PUBLISH_TIMEOUT: ${KARTA_TEST_PUBLISH_TIMEOUT:-6h}
      # Fault injection (internal/failpoint): test-only.
      KARTA_FAILPOINTS: ${KARTA_TEST_FAILPOINTS:-}
      # The validation-policy test shortens the operator request deadline.
      KARTA_OPERATOR_REQUEST_TIMEOUT: ${KARTA_TEST_OPERATOR_REQUEST_TIMEOUT:-60s}
      # Online updates are off unless the Stage 3 suite turns them on.
      KARTA_ONLINE_SOURCE_FILE: ${KARTA_TEST_ONLINE_SOURCE_FILE:-}
      KARTA_DATA_STALE_AFTER: ${KARTA_TEST_STALE_AFTER:-}
      # The local intake is off unless the Stage 5 suite turns it on.
      KARTA_INTAKE_DIR: ${KARTA_TEST_INTAKE_DIR:-}
      KARTA_INTAKE_AUTHORIZATION_MAX_AGE: ${KARTA_TEST_INTAKE_MAX_AGE:-}
      KARTA_INTAKE_MAX_OPEN: ${KARTA_TEST_INTAKE_MAX_OPEN:-2}
    volumes: !override
      - ${KARTA_INBOX_HOST_DIR:?set by make test-integration}:/data/inbox:ro
      - ./config/regions:/config/regions:ro
      - ./tests/integration/slow-osm2pgsql.sh:/usr/local/bin/slow-osm2pgsql:ro
      - ./tests/integration/forking-osm2pgsql.sh:/usr/local/bin/forking-osm2pgsql:ro
      # The Stage 3 suite's source files (test keys, test CA) and the
      # fetcher's outbox, both host directories the tests control.
      - ${KARTA_TEST_SOURCE_CONFIG_DIR:?set by make test-integration}:/config/sources:ro
      - ${KARTA_ONLINE_HOST_DIR:?set by make test-integration}:/data/online:ro
      # The Stage 5 intake handoff directory, a host directory the tests control.
      - ${KARTA_INTAKE_HOST_DIR:?set by make test-integration}:/data/intake:ro
      # Region files the validation-policy test writes.
      - ${KARTA_TEST_REGION_DIR:?set by make test-integration}:/config/test-regions:ro
    tmpfs: !override
      - /tmp:size=1g,mode=1777
      - /var/lib/karta/staging:size=${KARTA_TEST_STAGING_SIZE:-64m},uid=10001,gid=10001,mode=0700
    # A failpoint exit must stay down until the test restarts the publisher.
    restart: "no"
  # The monitoring profile on test ports (the operations suite starts it).
  postgres-exporter:
    ports: !override
      - "127.0.0.1:${KARTA_TEST_DB_METRICS_PORT:-18087}:9187"
  prometheus:
    ports: !override
      - "127.0.0.1:${KARTA_TEST_PROMETHEUS_PORT:-18090}:9090"
  importer:
    environment:
      KARTA_RETAIN_RELEASES: "2"
      # The region the test publisher serves (registry-summary, restore-check).
      KARTA_REGION_FILE: /config/regions/fixture.json
    volumes:
      - ./tests/integration/slow-osm2pgsql.sh:/usr/local/bin/slow-osm2pgsql:ro
  # The fetcher only reaches the controlled test source: `sourcenet` is
  # internal (no route out of Docker), so the suite cannot download from a
  # live external host. It runs as the test user so the tests can inspect,
  # tamper with and reset its outbox.
  fetcher:
    user: "${KARTA_TEST_UID:-65532}:${KARTA_TEST_GID:-65532}"
    environment:
      KARTA_ONLINE_SOURCE_FILE: ${KARTA_TEST_ONLINE_SOURCE_FILE:-/config/sources/online.json}
      KARTA_REGION_FILE: /config/regions/fixture.json
      KARTA_ONLINE_RESERVE_MB: "1"
      KARTA_MAX_INPUT_MB: ${KARTA_TEST_FETCH_MAX_INPUT_MB:-64}
      KARTA_FAILPOINTS: ${KARTA_TEST_FETCH_FAILPOINTS:-}
    volumes: !override
      - ${KARTA_ONLINE_HOST_DIR:?set by make test-integration}:/var/lib/karta/online
      - ./config/regions:/config/regions:ro
      - ${KARTA_TEST_SOURCE_CONFIG_DIR:?set by make test-integration}:/config/sources:ro
    networks: !override [sourcenet]
    # Names of local and private addresses, for the destination-policy tests.
    extra_hosts:
      - "loopback.test:127.0.0.1"
      - "metadata.test:169.254.169.254"
      - "lan.test:10.232.0.1"
    restart: "no"
  # The intake watcher and command (Stage 5 suite) run as the test user on
  # host directories the tests control: the landing area (owned by the test
  # user, its landing owner) and the handoff directory.
  intake-watch:
    user: "${KARTA_TEST_UID:-65532}:${KARTA_TEST_GID:-65532}"
    environment:
      KARTA_REGION_FILE: /config/regions/fixture.json
      KARTA_INTAKE_LANDING_UID: ${KARTA_TEST_UID:-65532}
      KARTA_INTAKE_SETTLE: 1s
      KARTA_INTAKE_POLL_INTERVAL: 1s
      KARTA_INTAKE_RESERVE_MB: "1"
      KARTA_MAX_INPUT_MB: "64"
      KARTA_FAILPOINTS: ${KARTA_TEST_INTAKE_FAILPOINTS:-}
    volumes: !override
      - ${KARTA_INTAKE_HOST_DIR:?set by make test-integration}:/data/intake
      - ${KARTA_INTAKE_LANDING_HOST_DIR:?set by make test-integration}:/landing:ro
      - ./config/regions:/config/regions:ro
    restart: "no"
  intake-cli:
    user: "${KARTA_TEST_UID:-65532}:${KARTA_TEST_GID:-65532}"
    environment:
      KARTA_REGION_FILE: /config/regions/fixture.json
      KARTA_INTAKE_RESERVE_MB: "1"
      KARTA_MAX_INPUT_MB: "64"
      KARTA_FAILPOINTS: ${KARTA_TEST_INTAKE_FAILPOINTS:-}
      KARTA_FAILPOINT_CLOCK: ${KARTA_TEST_INTAKE_CLOCK:-}
    volumes: !override
      - ${KARTA_INTAKE_HOST_DIR:?set by make test-integration}:/data/intake
      - ./config/regions:/config/regions:ro
  # The controlled HTTPS source (tests/integration/sourceserver), test-only.
  source:
    image: karta-testsource:local
    profiles: [online]
    environment:
      SOURCE_DOCROOT: /docroot
      SOURCE_TLS_CERT: /tls/server.pem
      SOURCE_TLS_KEY: /tls/server-key.pem
    volumes:
      - ${KARTA_TEST_SOURCE_DOCROOT:?set by make test-integration}:/docroot:ro
      - ${KARTA_TEST_SOURCE_TLS_DIR:?set by make test-integration}:/tls:ro
    networks:
      sourcenet:
        aliases: [source.test, mirror.test]
      sourcectl: {}
    ports:
      - "127.0.0.1:${KARTA_TEST_SOURCE_CTL_PORT:-18082}:8444"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

networks:
  sourcenet:
    internal: true
    ipam:
      config:
        - subnet: ${KARTA_TEST_SOURCE_SUBNET:-10.231.0.0/24}
  sourcectl: {}
