# Integration-test overrides (project `karta-test`, see `make test-integration`).
# Publishes PostgreSQL on 127.0.0.1 so tests can inspect and tamper with a
# release as the superuser; never use this file for a real deployment.
services:
  db:
    ports:
      - "127.0.0.1:${KARTA_TEST_DB_PORT:-55433}:5432"
    networks: [backend, frontend]
  api:
    ports: !override
      - "127.0.0.1:${KARTA_TEST_HTTP_PORT:-18080}:8080"
    environment:
      # The integration test recreates the API with another base URL to check
      # that previously issued style URLs are not reused for different bytes.
      KARTA_PUBLIC_BASE_URL: ${KARTA_TEST_PUBLIC_BASE_URL:-http://127.0.0.1:${KARTA_TEST_HTTP_PORT:-18080}}
      KARTA_RELEASE_POLL_INTERVAL: 1s
      KARTA_CORS_ALLOWED_ORIGINS: https://app.example
