# Karta stack: PostgreSQL/PostGIS, the public API (tiles, search, style,
# glyphs, demo), the publisher (inbox watcher, release builds, operator API)
# and an on-demand command-line importer. See docs/runbook.md.
#
# Networks: `backend` is internal (no route outside Docker); PostgreSQL is only
# reachable there and publishes no port. The API is additionally on `frontend`
# to publish its HTTP port, bound to 127.0.0.1 by default. The publisher is
# additionally on `operator`, only to publish the operator API port (bound to
# 127.0.0.1 by default); that network does not masquerade, so the publisher,
# which reads untrusted snapshots, has no NAT route to outside hosts.
#
# Online updates (Stage 3) are opt-in: the `fetcher` service (profile
# `online`, `make up-online`) is the only one with a route out, on its own
# `egress` network. It has no database credential; it writes verified
# deliveries into the `online` volume, which the publisher reads read-only.
name: karta

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - shared_buffers=${KARTA_DB_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=80
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
    secrets: [db_superuser_password, db_importer_password, db_api_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    shm_size: 256mb
    mem_limit: ${KARTA_DB_MEM_LIMIT:-2g}
    cpus: ${KARTA_DB_CPUS:-2}
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karta_registry -q"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    environment:
      KARTA_PUBLIC_BASE_URL: ${KARTA_PUBLIC_BASE_URL:-http://localhost:8080}
      KARTA_DB_HOST: db
      KARTA_DB_USER: karta_api
      KARTA_DB_PASSWORD_FILE: /run/secrets/db_api_password
      KARTA_CORS_ALLOWED_ORIGINS: ${KARTA_CORS_ALLOWED_ORIGINS:-}
      KARTA_RELEASE_POLL_INTERVAL: ${KARTA_RELEASE_POLL_INTERVAL:-5s}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
    secrets: [db_api_password]
    ports:
      - "${KARTA_HTTP_BIND:-127.0.0.1}:${KARTA_HTTP_PORT:-8080}:8080"
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_API_MEM_LIMIT:-512m}
    cpus: ${KARTA_API_CPUS:-1}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/karta", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  publisher:
    image: karta-importer:${KARTA_IMAGE_TAG:-local}
    entrypoint: ["/usr/local/bin/karta", "publisher"]
    environment: &publication-env
      KARTA_DB_HOST: db
      KARTA_DB_USER: karta_importer
      KARTA_DB_PASSWORD_FILE: /run/secrets/db_importer_password
      KARTA_REGION_FILE: /config/regions/${KARTA_PUBLISH_REGION:-tehran-chitgar}.json
      KARTA_INBOX_DIR: /data/inbox
      KARTA_STAGING_DIR: /var/lib/karta/staging
      KARTA_OPERATOR_TOKENS_FILE: /run/secrets/operator_tokens
      KARTA_PUBLISH_AUTO_ACTIVATE: ${KARTA_PUBLISH_AUTO_ACTIVATE:-true}
      KARTA_INBOX_POLL_INTERVAL: ${KARTA_INBOX_POLL_INTERVAL:-10s}
      KARTA_INBOX_SETTLE: ${KARTA_INBOX_SETTLE:-5s}
      KARTA_RELEASE_PIN_GRACE: ${KARTA_RELEASE_PIN_GRACE:-24h}
      KARTA_RETAIN_RELEASES: ${KARTA_RETAIN_RELEASES:-2}
      KARTA_RELEASE_STORAGE_BUDGET_MB: ${KARTA_RELEASE_STORAGE_BUDGET_MB:-10240}
      KARTA_MIN_FREE_MB: ${KARTA_MIN_FREE_MB:-512}
      KARTA_STAGING_RESERVE_MB: ${KARTA_STAGING_RESERVE_MB:-64}
      KARTA_RELEASE_TABLESPACE: ${KARTA_RELEASE_TABLESPACE:-}
      KARTA_OSM2PGSQL_CACHE_MB: ${KARTA_OSM2PGSQL_CACHE_MB:-800}
      KARTA_OSM2PGSQL_PROCESSES: ${KARTA_OSM2PGSQL_PROCESSES:-2}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
      # Online updates: empty (the default) keeps them off. Set to a source
      # file such as /config/sources/NAME.json and run `make up-online`.
      KARTA_ONLINE_SOURCE_FILE: ${KARTA_ONLINE_SOURCE_FILE:-}
      KARTA_ONLINE_DIR: /data/online
      # Data age after which the active release is reported stale (empty: no threshold).
      KARTA_DATA_STALE_AFTER: ${KARTA_DATA_STALE_AFTER:-}
    secrets: [db_importer_password, operator_tokens]
    volumes:
      - ${KARTA_INBOX_HOST_DIR:-./data/inbox}:/data/inbox:ro
      - staging:/var/lib/karta/staging
      - ./config/regions:/config/regions:ro
      - ./config/sources:/config/sources:ro
      - online:/data/online:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    ports:
      - "${KARTA_OPERATOR_BIND:-127.0.0.1}:${KARTA_OPERATOR_PORT:-8081}:8081"
    networks: [backend, operator]
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_PUBLISHER_MEM_LIMIT:-4g}
    cpus: ${KARTA_PUBLISHER_CPUS:-2}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/karta", "healthcheck", "--live", "--url", "http://127.0.0.1:8081"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *logging

  # Online source poller (opt-in, `make up-online`): polls the HTTPS source
  # named in KARTA_ONLINE_SOURCE_FILE, verifies signed manifests, downloads
  # within the source's limits and delivers verified snapshots to the
  # publisher through the `online` volume. No database access, no listener.
  fetcher:
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    profiles: [online]
    command: ["fetcher"]
    environment:
      KARTA_ONLINE_SOURCE_FILE: ${KARTA_ONLINE_SOURCE_FILE:-}
      KARTA_REGION_FILE: /config/regions/${KARTA_PUBLISH_REGION:-tehran-chitgar}.json
      KARTA_ONLINE_DIR: /var/lib/karta/online
      KARTA_MAX_INPUT_MB: ${KARTA_MAX_INPUT_MB:-4096}
      KARTA_ONLINE_RESERVE_MB: ${KARTA_ONLINE_RESERVE_MB:-64}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
    volumes:
      - online:/var/lib/karta/online
      - ./config/regions:/config/regions:ro
      - ./config/sources:/config/sources:ro
    networks: [egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_FETCHER_MEM_LIMIT:-256m}
    cpus: ${KARTA_FETCHER_CPUS:-0.5}
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  # One-off operator API client: `docker compose run --rm operator-cli status`.
  # It alone holds the raw operator token; the publisher only has its hash.
  operator-cli:
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    profiles: [tools]
    entrypoint: ["/usr/local/bin/karta", "operator"]
    environment:
      KARTA_OPERATOR_URL: http://publisher:8081
      KARTA_OPERATOR_TOKEN_FILE: /run/secrets/operator_token
    secrets: [operator_token]
    networks: [operator]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  importer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: importer
    image: karta-importer:${KARTA_IMAGE_TAG:-local}
    profiles: [tools]
    environment:
      <<: *publication-env
      KARTA_STAGING_DIR: /tmp
    secrets: [db_importer_password]
    volumes:
      - ./data/local:/data/local:ro
      - ./testdata:/data/testdata:ro
      - ./config/regions:/config/regions:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_IMPORTER_MEM_LIMIT:-4g}
    pids_limit: 256
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}
  operator:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Only the fetcher joins it: its route to the online source.
  egress: {}

volumes:
  pgdata: {}
  staging: {}
  # The fetcher's outbox: written by the fetcher, read-only for the publisher.
  online: {}

secrets:
  db_superuser_password:
    file: ./secrets/db_superuser_password
  db_importer_password:
    file: ./secrets/db_importer_password
  db_api_password:
    file: ./secrets/db_api_password
  operator_tokens:
    file: ./secrets/operator_tokens
  operator_token:
    file: ./secrets/operator_token
