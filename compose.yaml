# Karta stack: PostgreSQL/PostGIS, the public API (tiles, search, style,
# glyphs, demo), the publisher (inbox watcher, release builds, operator API)
# and an on-demand command-line importer. See docs/runbook.md.
#
# Networks: `backend` is internal (no route outside Docker); PostgreSQL is only
# reachable there and publishes no port. The API is additionally on `frontend`
# to publish its HTTP port, bound to 127.0.0.1 by default. The publisher is
# additionally on `operator`, only to publish the operator API port (bound to
# 127.0.0.1 by default); that network does not masquerade, so the publisher,
# which reads untrusted snapshots, has no NAT route to outside hosts.
#
# Online updates (Stage 3) are opt-in: the `fetcher` service (profile
# `online`, `make up-online`) is the only one with a route out, on its own
# `egress` network. It has no database credential; it writes verified
# deliveries into the `online` volume, which the publisher reads read-only.
#
# Local intake (Stage 5) is opt-in too: with KARTA_INTAKE_DIR=/data/intake
# the publisher scans the `intake` volume (read-only) first. The watcher
# (profile `intake`, `make up-intake`) watches a protected landing area and
# the command (`intake-cli`, `make intake-submit`) submits one file; both
# hand off into that volume and hold only a narrow operator credential (no
# database, no route out). The controlled source bridge is in
# compose.bridge.yaml (docs/runbook.md, "Controlled source bridge").
name: karta

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - shared_buffers=${KARTA_DB_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=80
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
    secrets: [db_superuser_password, db_importer_password, db_api_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    shm_size: 256mb
    mem_limit: ${KARTA_DB_MEM_LIMIT:-2g}
    cpus: ${KARTA_DB_CPUS:-2}
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karta_registry -q"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    environment:
      KARTA_PUBLIC_BASE_URL: ${KARTA_PUBLIC_BASE_URL:-http://localhost:8080}
      KARTA_DB_HOST: db
      KARTA_DB_USER: karta_api
      KARTA_DB_PASSWORD_FILE: /run/secrets/db_api_password
      KARTA_CORS_ALLOWED_ORIGINS: ${KARTA_CORS_ALLOWED_ORIGINS:-}
      KARTA_RELEASE_POLL_INTERVAL: ${KARTA_RELEASE_POLL_INTERVAL:-5s}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
      # Request metrics on their own listener, for the monitoring credential
      # only (secrets/metrics_tokens); never on the public port.
      KARTA_METRICS_LISTEN_ADDR: ":9464"
      KARTA_METRICS_TOKENS_FILE: /run/secrets/metrics_tokens
    secrets: [db_api_password, metrics_tokens]
    ports:
      - "${KARTA_HTTP_BIND:-127.0.0.1}:${KARTA_HTTP_PORT:-8080}:8080"
      - "${KARTA_METRICS_BIND:-127.0.0.1}:${KARTA_API_METRICS_PORT:-9464}:9464"
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_API_MEM_LIMIT:-512m}
    cpus: ${KARTA_API_CPUS:-1}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/karta", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  publisher:
    image: karta-importer:${KARTA_IMAGE_TAG:-local}
    entrypoint: ["/usr/local/bin/karta", "publisher"]
    # A minimal init (docker-init) is PID 1 and reaps every process a build
    # leaves behind; karta itself also stops osm2pgsql's whole process group.
    init: true
    # Time to drop the candidate and record an interrupted publication on
    # shutdown before Docker kills the process.
    stop_grace_period: 30s
    environment: &publication-env
      KARTA_DB_HOST: db
      KARTA_DB_USER: karta_importer
      KARTA_DB_PASSWORD_FILE: /run/secrets/db_importer_password
      KARTA_REGION_FILE: /config/regions/${KARTA_PUBLISH_REGION:-tehran-chitgar}.json
      KARTA_INBOX_DIR: /data/inbox
      KARTA_STAGING_DIR: /var/lib/karta/staging
      KARTA_OPERATOR_TOKENS_FILE: /run/secrets/operator_tokens
      KARTA_PUBLISH_AUTO_ACTIVATE: ${KARTA_PUBLISH_AUTO_ACTIVATE:-true}
      KARTA_INBOX_POLL_INTERVAL: ${KARTA_INBOX_POLL_INTERVAL:-10s}
      KARTA_INBOX_SETTLE: ${KARTA_INBOX_SETTLE:-5s}
      KARTA_RELEASE_PIN_GRACE: ${KARTA_RELEASE_PIN_GRACE:-24h}
      KARTA_RETAIN_RELEASES: ${KARTA_RETAIN_RELEASES:-2}
      KARTA_RELEASE_STORAGE_BUDGET_MB: ${KARTA_RELEASE_STORAGE_BUDGET_MB:-10240}
      KARTA_MIN_FREE_MB: ${KARTA_MIN_FREE_MB:-512}
      KARTA_STAGING_RESERVE_MB: ${KARTA_STAGING_RESERVE_MB:-64}
      KARTA_RELEASE_TABLESPACE: ${KARTA_RELEASE_TABLESPACE:-}
      KARTA_OSM2PGSQL_CACHE_MB: ${KARTA_OSM2PGSQL_CACHE_MB:-800}
      KARTA_OSM2PGSQL_PROCESSES: ${KARTA_OSM2PGSQL_PROCESSES:-2}
      # Whole-publication deadline (staging through validation). The default
      # is provisional: set it from measured publication times on the target
      # host (docs/operations.md).
      KARTA_PUBLISH_TIMEOUT: ${KARTA_PUBLISH_TIMEOUT:-6h}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
      # Online updates: empty (the default) keeps them off. Set to a source
      # file such as /config/sources/NAME.json and run `make up-online`.
      KARTA_ONLINE_SOURCE_FILE: ${KARTA_ONLINE_SOURCE_FILE:-}
      KARTA_ONLINE_DIR: /data/online
      # Data age after which the active release is reported stale (empty: no threshold).
      KARTA_DATA_STALE_AFTER: ${KARTA_DATA_STALE_AFTER:-}
      # Local intake: empty (the default) keeps it off and refuses intake
      # authorizations. Set to /data/intake (the `intake` volume) to enable.
      KARTA_INTAKE_DIR: ${KARTA_INTAKE_DIR:-}
      # Cap on an intake authorization's lifetime (empty: derived from the
      # publish deadline, the retry limit and KARTA_INTAKE_MAX_OPEN).
      KARTA_INTAKE_AUTHORIZATION_MAX_AGE: ${KARTA_INTAKE_AUTHORIZATION_MAX_AGE:-}
      KARTA_INTAKE_MAX_OPEN: ${KARTA_INTAKE_MAX_OPEN:-2}
    secrets: [db_importer_password, operator_tokens]
    volumes:
      - ${KARTA_INBOX_HOST_DIR:-./data/inbox}:/data/inbox:ro
      - staging:/var/lib/karta/staging
      - ./config/regions:/config/regions:ro
      - ./config/sources:/config/sources:ro
      - online:/data/online:ro
      - intake:/data/intake:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    ports:
      - "${KARTA_OPERATOR_BIND:-127.0.0.1}:${KARTA_OPERATOR_PORT:-8081}:8081"
    networks: [backend, operator]
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_PUBLISHER_MEM_LIMIT:-4g}
    cpus: ${KARTA_PUBLISHER_CPUS:-2}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/karta", "healthcheck", "--live", "--url", "http://127.0.0.1:8081"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *logging

  # Online source poller (opt-in, `make up-online`): polls the HTTPS source
  # named in KARTA_ONLINE_SOURCE_FILE, verifies signed manifests, downloads
  # within the source's limits and delivers verified snapshots to the
  # publisher through the `online` volume. No database access, no listener.
  fetcher:
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    profiles: [online]
    command: ["fetcher"]
    environment:
      KARTA_ONLINE_SOURCE_FILE: ${KARTA_ONLINE_SOURCE_FILE:-}
      KARTA_REGION_FILE: /config/regions/${KARTA_PUBLISH_REGION:-tehran-chitgar}.json
      KARTA_ONLINE_DIR: /var/lib/karta/online
      KARTA_MAX_INPUT_MB: ${KARTA_MAX_INPUT_MB:-4096}
      KARTA_ONLINE_RESERVE_MB: ${KARTA_ONLINE_RESERVE_MB:-64}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
    volumes:
      - online:/var/lib/karta/online
      - ./config/regions:/config/regions:ro
      - ./config/sources:/config/sources:ro
    networks: [egress]
    # The image's health check probes the API listener, which the fetcher
    # does not have; its liveness is the age of its state file, reported by
    # the publisher (karta_online_fetcher_state_age_seconds).
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_FETCHER_MEM_LIMIT:-256m}
    cpus: ${KARTA_FETCHER_CPUS:-0.5}
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  # Local intake watcher (opt-in, `make up-intake`): watches the protected
  # landing area (KARTA_INTAKE_LANDING_HOST_DIR, read-only here) for
  # deliveries with a producer completion marker, checks the landing
  # boundary before every scan, copies and hashes each delivery into the
  # `intake` volume, and authorizes exactly that digest with its own
  # intake_watch credential. No database, no route out: only `operator`.
  intake-watch:
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    profiles: [intake]
    command: ["intake", "watch"]
    environment:
      KARTA_INTAKE_DIR: /data/intake
      KARTA_REGION_FILE: /config/regions/${KARTA_PUBLISH_REGION:-tehran-chitgar}.json
      KARTA_OPERATOR_URL: http://publisher:8081
      KARTA_OPERATOR_TOKEN_FILE: /run/secrets/intake_watch_token
      KARTA_INTAKE_LANDING_DIR: /landing
      # The landing owner's numeric UID (the SFTP landing account) and,
      # optionally, the one group allowed to write the landing directory.
      KARTA_INTAKE_LANDING_UID: ${KARTA_INTAKE_LANDING_UID:-}
      KARTA_INTAKE_WRITER_GID: ${KARTA_INTAKE_WRITER_GID:-}
      KARTA_INTAKE_SETTLE: ${KARTA_INTAKE_SETTLE:-10s}
      KARTA_INTAKE_POLL_INTERVAL: ${KARTA_INTAKE_POLL_INTERVAL:-10s}
      KARTA_INTAKE_AUTHORIZATION_TTL: ${KARTA_INTAKE_AUTHORIZATION_TTL:-}
      KARTA_MAX_INPUT_MB: ${KARTA_MAX_INPUT_MB:-4096}
      KARTA_INTAKE_RESERVE_MB: ${KARTA_INTAKE_RESERVE_MB:-64}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
    secrets: [intake_watch_token]
    volumes:
      - intake:/data/intake
      - ${KARTA_INTAKE_LANDING_HOST_DIR:-./data/landing}:/landing:ro
      - ./config/regions:/config/regions:ro
    networks: [operator]
    # Its liveness is the age of its state file, reported by the publisher
    # (karta_intake_watcher_state_age_seconds), as for the fetcher.
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_INTAKE_MEM_LIMIT:-256m}
    cpus: ${KARTA_INTAKE_CPUS:-0.5}
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  # One-off authenticated intake command (`make intake-submit`): the file,
  # its expectation and the person's own intake_submit token are mounted by
  # the make target for that run only.
  intake-cli:
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    profiles: [tools]
    entrypoint: ["/usr/local/bin/karta", "intake"]
    environment:
      KARTA_INTAKE_DIR: /data/intake
      KARTA_REGION_FILE: /config/regions/${KARTA_PUBLISH_REGION:-tehran-chitgar}.json
      KARTA_OPERATOR_URL: http://publisher:8081
      KARTA_OPERATOR_TOKEN_FILE: /run/secrets/intake_token
      KARTA_INTAKE_AUTHORIZATION_TTL: ${KARTA_INTAKE_AUTHORIZATION_TTL:-}
      KARTA_MAX_INPUT_MB: ${KARTA_MAX_INPUT_MB:-4096}
      KARTA_INTAKE_RESERVE_MB: ${KARTA_INTAKE_RESERVE_MB:-64}
      KARTA_LOG_LEVEL: ${KARTA_LOG_LEVEL:-info}
    volumes:
      - intake:/data/intake
      - ./config/regions:/config/regions:ro
    networks: [operator]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_INTAKE_MEM_LIMIT:-256m}
    cpus: ${KARTA_INTAKE_CPUS:-0.5}
    pids_limit: 64
    logging: *logging

  # One-off operator API client: `docker compose run --rm operator-cli status`.
  # It alone holds the raw operator token; the publisher only has its hash.
  operator-cli:
    image: karta-api:${KARTA_IMAGE_TAG:-local}
    profiles: [tools]
    entrypoint: ["/usr/local/bin/karta", "operator"]
    environment:
      KARTA_OPERATOR_URL: http://publisher:8081
      KARTA_OPERATOR_TOKEN_FILE: /run/secrets/operator_token
    secrets: [operator_token]
    networks: [operator]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Optional monitoring (profile `monitoring`, `make up-monitoring`). The
  # exporter reads PostgreSQL statistics as karta_monitor (pg_monitor: no
  # table data); Prometheus scrapes the API, the publisher and the exporter
  # with the monitoring credential and evaluates deploy/monitoring/alerts.yml.
  # Both reach their targets on `backend`; `monitoring` (no NAT) only
  # publishes their ports, on 127.0.0.1 by default.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [monitoring]
    command: ["--web.listen-address=:9187"]
    environment:
      DATA_SOURCE_URI: db:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: karta_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/db_monitor_password
    secrets: [db_monitor_password]
    ports:
      - "${KARTA_METRICS_BIND:-127.0.0.1}:${KARTA_DB_METRICS_PORT:-9187}:9187"
    networks: [backend, monitoring]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [monitoring]
    command:
      - --config.file=/etc/karta/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${KARTA_PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=:9090
    volumes:
      - ./deploy/monitoring:/etc/karta:ro
      - prometheus:/prometheus
    tmpfs:
      - /tmp:size=64m
    secrets: [operator_monitor_token]
    ports:
      - "${KARTA_METRICS_BIND:-127.0.0.1}:${KARTA_PROMETHEUS_PORT:-9090}:9090"
    networks: [backend, monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_PROMETHEUS_MEM_LIMIT:-512m}
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  importer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: importer
    image: karta-importer:${KARTA_IMAGE_TAG:-local}
    profiles: [tools]
    init: true
    environment:
      <<: *publication-env
      KARTA_STAGING_DIR: /tmp
    secrets: [db_importer_password]
    volumes:
      - ./data/local:/data/local:ro
      - ./testdata:/data/testdata:ro
      - ./config/regions:/config/regions:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KARTA_IMPORTER_MEM_LIMIT:-4g}
    pids_limit: 256
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}
  operator:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Only the fetcher joins it: its route to the online source.
  egress: {}
  # Publishes the optional monitoring ports; no NAT route out.
  monitoring:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  pgdata: {}
  staging: {}
  # The fetcher's outbox: written by the fetcher, read-only for the publisher.
  online: {}
  # The intake handoff directory: written by the intake watcher and command,
  # read-only for the publisher.
  intake: {}
  # Prometheus' time-series storage (monitoring profile).
  prometheus: {}

secrets:
  db_superuser_password:
    file: ./secrets/db_superuser_password
  db_importer_password:
    file: ./secrets/db_importer_password
  db_api_password:
    file: ./secrets/db_api_password
  operator_tokens:
    file: ./secrets/operator_tokens
  operator_token:
    file: ./secrets/operator_token
  metrics_tokens:
    file: ./secrets/metrics_tokens
  operator_monitor_token:
    file: ./secrets/operator_monitor_token
  # The intake watcher's own credential (scope intake_watch only), created
  # by `make up-intake` with scripts/operator-credential.sh.
  intake_watch_token:
    file: ./secrets/intake_watch_token
  db_monitor_password:
    file: ./secrets/db_monitor_password
