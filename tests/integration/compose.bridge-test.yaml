# Integration-test overrides for the co-located bridge (TestBridge), used
# after compose.yaml, compose.test.yaml and compose.bridge.yaml. The
# downloader reaches only the controlled test source (`sourcenet`, internal),
# every bridge process runs as the test user on host directories the test
# controls, and the signing key and TLS files are generated by the test at
# run time. Never use this file for a deployment.
services:
  bridge-acquire:
    user: "${KARTA_TEST_UID:-65532}:${KARTA_TEST_GID:-65532}"
    environment:
      KARTA_BRIDGE_SOURCE_FILE: /config/bridge/source.json
      KARTA_MAX_INPUT_MB: "64"
      KARTA_BRIDGE_RESERVE_MB: "1"
      KARTA_FAILPOINTS: ${KARTA_TEST_BRIDGE_FAILPOINTS:-}
    volumes: !override
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/spool:/var/lib/karta/bridge/spool
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/config:/config/bridge:ro
    networks: !override [sourcenet]
    restart: "no"
  bridge-sign:
    user: "${KARTA_TEST_UID:-65532}:${KARTA_TEST_GID:-65532}"
    environment:
      KARTA_REGION_FILE: /config/regions/fixture.json
      KARTA_BRIDGE_SIGNER_FILE: /config/bridge/signer.json
      KARTA_MAX_INPUT_MB: "64"
      KARTA_BRIDGE_SIGN_POLL: 1s
      KARTA_FAILPOINTS: ${KARTA_TEST_BRIDGE_FAILPOINTS:-}
    volumes: !override
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/spool:/var/lib/karta/bridge/spool:ro
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/publish:/var/lib/karta/bridge/publish
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/state:/var/lib/karta/bridge/state
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/config:/config/bridge:ro
      - ./config/regions:/config/regions:ro
    restart: "no"
  bridge-serve:
    user: "${KARTA_TEST_UID:-65532}:${KARTA_TEST_GID:-65532}"
    environment:
      KARTA_BRIDGE_METRICS_LISTEN_ADDR: ":9465"
    volumes: !override
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/publish:/var/lib/karta/bridge/publish:ro
      - ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/spool:/var/lib/karta/bridge/spool:ro
    ports: !override
      - "127.0.0.1:${KARTA_TEST_BRIDGE_PORT:-18443}:8443"
      - "127.0.0.1:${KARTA_TEST_BRIDGE_METRICS_PORT:-18465}:9465"
    restart: "no"

secrets:
  bridge_signing_key:
    file: ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/keys/signing-key.pem
  bridge_tls_cert:
    file: ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/tls/tls.pem
  bridge_tls_key:
    file: ${KARTA_TEST_BRIDGE_DIR:?set by make test-integration}/tls/tls-key.pem
